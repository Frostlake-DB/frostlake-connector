[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "frostlake-connector"
description = "A high-level Frostlake client, built on the Frostlake Python driver"
readme = "README.md"
# Floor follows the frostlake driver's own floor.
requires-python = ">=3.9"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "MLorek" }]
keywords = ["frostlake", "connector", "client", "sql", "database", "dbapi", "pep249"]
dynamic = ["version"]
dependencies = ["frostlake>=0.2.0"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Database",
    "Topic :: Database :: Front-Ends",
]

[project.urls]
Homepage = "https://frostlake.dev"
Source = "https://github.com/Frostlake-DB/frostlake-connector"
Issues = "https://github.com/Frostlake-DB/frostlake-connector/issues"

[tool.setuptools]
packages = ["frostlake_connector"]

[tool.setuptools.dynamic]
version = { attr = "frostlake_connector.__version__" }
